# Settlement Lakehouse - local stack (~2 GB RAM idle). Usage: docker compose up -d --build
# NOTE: MinIO is built from source (docker/minio) because upstream stopped publishing images.
name: settlement-lakehouse

x-aws-env: &aws-env
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
  AWS_REGION: us-east-1

services:
  minio:
    build: {context: docker/minio}
    image: settlement-minio:local
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes: [minio-data:/data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: settlement-minio:local
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${WAREHOUSE_BUCKET:-warehouse}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
    restart: "no"
    mem_limit: 128m

  catalog:
    image: apache/iceberg-rest-fixture:1.9.2
    user: "0:0"   # named volume is root-owned; dev-only
    depends_on:
      minio-init: {condition: service_completed_successfully}
    environment:
      <<: *aws-env
      CATALOG_WAREHOUSE: s3://${WAREHOUSE_BUCKET:-warehouse}/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_URI: jdbc:sqlite:file:/data/catalog.db
    ports: ["127.0.0.1:8181:8181"]
    volumes: [catalog-data:/data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/v1/config || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  pipeline:
    build: {context: ., dockerfile: docker/pipeline/Dockerfile}
    profiles: ["tools"]   # started on demand by `docker compose run`
    depends_on:
      catalog: {condition: service_healthy}
    environment:
      <<: *aws-env
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
      CATALOG_URI: http://catalog:8181
      S3_ENDPOINT: http://minio:9000
    volumes: ["./data:/app/data"]
    mem_limit: 3g

volumes:
  minio-data:
  catalog-data:
