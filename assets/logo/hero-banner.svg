<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Settlement Lakehouse banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".9"/><stop offset="1" stop-color="#8b5cf6" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity=".04">
    <path d="M0 80H1200M0 160H1200M0 240H1200M300 0V320M600 0V320M900 0V320"/>
  </g>
  <!-- iceberg: tip above the waterline, bulk of the lake below -->
  <g transform="translate(110 40)">
    <path d="M70 0 L110 70 L30 70 Z" fill="url(#ice)"/>
    <rect x="-20" y="70" width="220" height="3" fill="#22d3ee" opacity=".6"/>
    <path d="M-10 78 H190 L150 170 H30 Z" fill="url(#ice)" opacity=".35"/>
    <g fill="none" stroke="url(#accent)" stroke-width="2.5">
      <ellipse cx="90" cy="196" rx="70" ry="12"/>
      <path d="M20 196v34c0 7 31 13 70 13s70-6 70-13v-34"/>
      <path d="M20 213c0 7 31 13 70 13s70-6 70-13"/>
    </g>
  </g>
  <text x="340" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="3" fill="#f1f5f9">SETTLEMENT</text>
  <text x="340" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="3" fill="url(#accent)">LAKEHOUSE</text>
  <text x="342" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#94a3b8">A Dockerized Apache Iceberg Data Engineering Platform</text>
  <g font-family="Consolas, monospace" font-size="15" fill="#cbd5e1">
    <text x="900" y="110">Iceberg · Spark · MinIO</text>
    <text x="900" y="140">REST Catalog · DuckDB</text>
    <text x="900" y="170" fill="#22d3ee">bronze → silver → gold</text>
  </g>
</svg>
