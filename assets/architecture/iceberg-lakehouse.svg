  <g stroke="#94a3b8" stroke-width="2" fill="none"><path d="M200 115H250M420 115H470M660 115H710M565 160V200M880 115H920"/></g>
  <text x="30" y="300" font-size="14" fill="#cbd5e1">Table state = catalog pointer to the current metadata file. Readers see only committed snapshots.</text>
  <text x="30" y="322" font-size="13" fill="#94a3b8">* Trino is not in this repository's Compose stack; DuckDB reader is not yet verified. Engine support depends on version and catalog.</text>
