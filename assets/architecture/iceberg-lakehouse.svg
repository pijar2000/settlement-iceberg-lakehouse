<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="1100" height="340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1100" height="340" fill="#0b1020"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#ffffff">Approach B: Apache Iceberg lakehouse</text>
  <g font-size="15" fill="#ffffff" text-anchor="middle">
    <rect x="30" y="80" width="170" height="70" rx="10" fill="#1e2548" stroke="#8b5cf6" stroke-width="2"/><text x="115" y="120">Source DB /</text><text x="115" y="140">settlement files</text>
    <rect x="250" y="80" width="170" height="70" rx="10" fill="#1e2548" stroke="#8b5cf6" stroke-width="2"/><text x="335" y="120">Apache Spark</text>
    <rect x="470" y="70" width="190" height="90" rx="10" fill="#2a1f4d" stroke="#22d3ee" stroke-width="2.5"/><text x="565" y="105">Apache Iceberg</text><text x="565" y="127" font-size="12" fill="#cbd5e1">snapshots - manifests</text><text x="565" y="145" font-size="12" fill="#cbd5e1">Bronze / Silver / Gold</text>
    <rect x="710" y="80" width="170" height="70" rx="10" fill="#1e2548" stroke="#22d3ee" stroke-width="2"/><text x="795" y="120">Object storage</text><text x="795" y="140" font-size="12" fill="#cbd5e1">MinIO / Ceph</text>
    <rect x="470" y="200" width="190" height="55" rx="10" fill="#1e2548" stroke="#8b5cf6" stroke-width="2"/><text x="565" y="233">REST Catalog</text>
    <rect x="920" y="60" width="150" height="40" rx="8" fill="#1e2548" stroke="#22d3ee"/><text x="995" y="86">Spark SQL</text>
    <rect x="920" y="110" width="150" height="40" rx="8" fill="#1e2548" stroke="#22d3ee"/><text x="995" y="136">Trino *</text>
    <rect x="920" y="160" width="150" height="40" rx="8" fill="#1e2548" stroke="#22d3ee"/><text x="995" y="186">DuckDB *</text>
